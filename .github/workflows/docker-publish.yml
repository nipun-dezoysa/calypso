name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (defaults to the default branch)"
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_REPOSITORY || 'nipundezoysa/calypso' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=Calypso
            org.opencontainers.image.description=A self-sufficient, local AI workspace for orchestrating autonomous agents, MCP servers, and multi-model workflows.

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test the image
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          set -uo pipefail
          docker run -d --name calypso-smoke -p 8000:8000 "$IMAGE"

          up=""
          for _ in $(seq 1 60); do
            # A container that died won't ever answer, so stop waiting on it.
            if [ "$(docker inspect -f '{{.State.Running}}' calypso-smoke)" != "true" ]; then
              echo "::error::container exited before serving traffic (exit code $(docker inspect -f '{{.State.ExitCode}}' calypso-smoke))"
              break
            fi
            if curl -fsS http://localhost:8000/openapi.json > /dev/null 2>&1; then
              up=1
              echo "API is up"
              break
            fi
            sleep 2
          done

          if [ -z "$up" ]; then
            echo "::group::container logs"
            docker logs calypso-smoke 2>&1 || true
            echo "::endgroup::"
            exit 1
          fi

          curl -fsS http://localhost:8000/ | grep -q '<div id="root">' \
            || { echo "::error::frontend bundle is not being served"; exit 1; }
          echo "Frontend is served"

      - name: Container logs
        if: always()
        run: docker logs calypso-smoke || true

      - name: Stop smoke-test container
        if: always()
        run: docker rm -f calypso-smoke || true

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
