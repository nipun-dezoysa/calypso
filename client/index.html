<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calypso</title>

    <script>
      (function () {
        try {
          var raw = localStorage.getItem('calypso-active-theme-tokens');
          if (!raw) return;
          var tokens = JSON.parse(raw);
          var map = {
            bg: '--c-bg', surface: '--c-surface', hover: '--c-hover', activeBg: '--c-active-bg',
            border: '--c-border', borderFocus: '--c-border-focus', textStrong: '--c-text-strong',
            text: '--c-text', textBody: '--c-text-body', textDim: '--c-text-dim',
            textMuted: '--c-text-muted', textSubtle: '--c-text-subtle', accent: '--c-accent',
            accentHi: '--c-accent-hi', accentLo: '--c-accent-lo', accentContrast: '--c-accent-contrast'
          };
          for (var key in map) {
            if (tokens[key]) document.documentElement.style.setProperty(map[key], tokens[key]);
          }
          // Mirrors utils/theme.ts's isDark() luminance check, so native form
          // controls (input/select/scrollbars) paint correctly before React
          // (and that module) has loaded.
          if (tokens.bg) {
            var hex = tokens.bg.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
            var num = parseInt(hex, 16);
            var r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
            var lin = function (c) { c = c / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
            var luminance = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
            document.documentElement.style.colorScheme = luminance < 0.5 ? 'dark' : 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
